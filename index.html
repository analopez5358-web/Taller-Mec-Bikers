<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Taller de Motos</title>
    <!-- Tailwind CSS para un diseño rápido y limpio -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    <div class="container mx-auto p-4 max-w-4xl">
        <header class="bg-blue-600 text-white p-4 rounded-lg shadow-md mb-6 flex justify-between items-center">
            <h1 class="text-xl font-bold">🏍️ Taller de Motos - Control</h1>
            <span id="fecha-actual" class="text-sm"></span>
        </header>

        <!-- Formulario de Ingreso -->
        <div class="bg-white p-6 rounded-lg shadow-md mb-6">
            <h2 class="text-lg font-semibold mb-4 text-gray-700">Nueva Orden de Ingreso</h2>
            <form id="form-orden" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-600">Nombre del Cliente</label>
                    <input type="text" id="cliente" required class="w-full mt-1 p-2 border rounded-md focus:ring focus:ring-blue-300">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600">Teléfono / WhatsApp</label>
                    <input type="tel" id="telefono" required class="w-full mt-1 p-2 border rounded-md focus:ring focus:ring-blue-300">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600">Moto (Marca y Modelo)</label>
                    <input type="text" id="moto" required class="w-full mt-1 p-2 border rounded-md focus:ring focus:ring-blue-300" placeholder="Ej. Honda CB125">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600">Placa</label>
                    <input type="text" id="placa" required class="w-full mt-1 p-2 border rounded-md focus:ring focus:ring-blue-300">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-600">Falla Reportada / Trabajo a Realizar</label>
                    <textarea id="falla" rows="2" required class="w-full mt-1 p-2 border rounded-md focus:ring focus:ring-blue-300"></textarea>
                </div>
                <div class="md:col-span-2">
                    <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded-md font-semibold hover:bg-blue-700 transition">
                        Guardar e Ingresar Moto
                    </button>
                </div>
            </form>
        </div>

        <!-- Listado de Órdenes Activas -->
        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-lg font-semibold mb-4 text-gray-700">Motos en Taller</h2>
            <div id="lista-ordenes" class="space-y-4">
                <!-- Aquí se cargan dinámicamente las órdenes -->
            </div>
        </div>
    </div>

    <script>
        // Mostrar fecha actual
        document.getElementById('fecha-actual').innerText = new Date().toLocaleDateString();

        // Cargar órdenes guardadas al iniciar
        document.addEventListener('DOMContentLoaded', mostrarOrdenes);

        document.getElementById('form-orden').addEventListener('submit', function(e) {
            e.preventDefault();

            const nuevaOrden = {
                id: Date.now(),
                cliente: document.getElementById('cliente').value,
                telefono: document.getElementById('telefono').value,
                moto: document.getElementById('moto').value,
                placa: document.getElementById('placa').value.toUpperCase(),
                falla: document.getElementById('falla').value,
                estado: 'Pendiente',
                fecha: new Date().toLocaleDateString()
            };

            let ordenes = JSON.parse(localStorage.getItem('taller_ordenes')) || [];
            ordenes.push(nuevaOrden);
            localStorage.setItem('taller_ordenes', JSON.stringify(ordenes));

            document.getElementById('form-orden').reset();
            mostrarOrdenes();
        });

        function mostrarOrdenes() {
            const contenedor = document.getElementById('lista-ordenes');
            let ordenes = JSON.parse(localStorage.getItem('taller_ordenes')) || [];

            if (ordenes.length === 0) {
                contenedor.innerHTML = '<p class="text-gray-500 text-center">No hay motos registradas en este momento.</p>';
                return;
            }

            contenedor.innerHTML = '';
            ordenes.forEach(orden => {
                contenedor.innerHTML += `
                    <div class="border p-4 rounded-lg flex flex-col md:flex-row justify-between items-start md:items-center bg-gray-50 gap-4">
                        <div>
                            <span class="text-xs bg-blue-100 text-blue-800 px-2 py-1 rounded font-semibold">${orden.estado}</span>
                            <h3 class="font-bold text-lg mt-1">${orden.moto} (Placa: ${orden.placa})</h3>
                            <p class="text-sm text-gray-600"><strong>Cliente:</strong> ${orden.cliente} - 📱 ${orden.telefono}</p>
                            <p class="text-sm text-gray-700 mt-1"><strong>Falla:</strong> ${orden.falla}</p>
                            <span class="text-xs text-gray-400">Ingreso: ${orden.fecha}</span>
                        </div>
                        <div class="flex gap-2 w-full md:w-auto">
                            <button onclick="cambiarEstado(${orden.id})" class="flex-1 md:flex-none bg-yellow-500 text-white px-3 py-1 rounded text-sm hover:bg-yellow-600">Cambiar Estado</button>
                            <button onclick="eliminarOrden(${orden.id})" class="flex-1 md:flex-none bg-red-500 text-white px-3 py-1 rounded text-sm hover:bg-red-600">Eliminar</button>
                        </div>
                    </div>
                `;
            });
        }

        function cambiarEstado(id) {
            let ordenes = JSON.parse(localStorage.getItem('taller_ordenes')) || [];
            ordenes = ordenes.map(orden => {
                if (orden.id === id) {
                    if (orden.estado === 'Pendiente') orden.estado = 'En Reparación';
                    else if (orden.estado === 'En Reparación') orden.estado = 'Lista para Entregar';
                    else orden.estado = 'Pendiente';
                }
                return orden;
            });
            localStorage.setItem('taller_ordenes', JSON.stringify(ordenes));
            mostrarOrdenes();
        }

        function eliminarOrden(id) {
            if (confirm('¿Estás seguro de eliminar esta orden?')) {
                let ordenes = JSON.parse(localStorage.getItem('taller_ordenes')) || [];
                ordenes = ordenes.filter(orden => orden.id !== id);
                localStorage.setItem('taller_ordenes', JSON.stringify(ordenes));
                mostrarOrdenes();
            }
        }
    </script>
</body>
</html>
